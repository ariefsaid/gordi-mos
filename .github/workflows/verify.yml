name: verify

on:
  # PR-only: a merge into main re-runs nothing (the PR head was gated). Deliberately NOT
  # path-filtered — `verify` is a required status check, and a check skipped by a path filter
  # never reports, so the PR would block forever. PR-side savings come from the per-step
  # `steps.scope.outputs.app` guard instead, which still reports the check as green.
  pull_request:

# Public repo: fork PRs run this workflow. Nothing here needs to write, so the token gets
# read-only. Actions are pinned to commit SHAs (tags are mutable — a hijacked v4 would run here).
permissions:
  contents: read

# Supersede in-flight runs on the same ref: every push to a branch would otherwise run to
# completion even after the next push lands.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mos-app

jobs:
  verify:
    # A release PR (main → staging, head in this repo, never a fork's branch named main) carries a
    # tree that already passed on its way into main. A skipped required check counts as passed.
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'staging' && github.head_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the base commit to diff against; the default shallow clone has only HEAD.
          fetch-depth: 0

      # Every step below costs ~170s and can only ever exercise mos-app/. On a commit that
      # touches none of it the run is pure latency AND a false-negative source: on 2026-07-30 a
      # scripts + pgTAP + docs commit went red on a flake in a React suite it could not have
      # affected. Skipping the steps (rather than the job) keeps the required check reporting.
      #
      # FAIL-CLOSED BY CONSTRUCTION. The obvious form of this guard — "skip unless mos-app/
      # changed" — is fail-OPEN: it assumes today's repo layout is permanent, so the day the app
      # comes to depend on anything outside mos-app/ (a root package.json, a shared package, a
      # generated types dir) the filter is silently stale and the gate stops running with nobody
      # told. Inverted here: skip only when EVERY changed path matches the inert allowlist below.
      # Anything unrecognised — including any new top-level directory — runs the full gate. The
      # failure mode of an out-of-date allowlist is then a wasted 170s, not an unrun gate.
      - name: Scope — does this change touch the app?
        id: scope
        working-directory: .
        # BASE_REF via env, never interpolated into the script body. Git refnames permit `"`, `;`,
        # `$` and backticks, so `${{ }}` inside a quoted shell string is breakable in principle.
        # base_ref is the TARGET branch (dev/main) and so is not fork-controlled — this is
        # defence-in-depth per GitHub's hardening guidance, not a live vector. Adopted from PMO.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Explicit refspec, not `git fetch origin <branch>`: the short form only updates the
          # remote-tracking ref when the configured refspec happens to cover it, so it can exit 0
          # while origin/<base> stays frozen — the same fail-open that bit scripts/pre-merge-check.sh.
          # Getting the base wrong here would silently skip the gate on a real app change.
          git fetch --quiet --no-tags origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          RANGE="$(git merge-base "origin/${BASE_REF}" HEAD)..HEAD"
          # Paths that provably cannot affect `npm run typecheck | lint:ci | test:coverage | build`.
          # supabase/ is NOT inert: unit tests read migration and seed files from disk. ADDING TO THIS
          # LIST IS A DELIBERATE ACT: each entry is a promise that the app gate cannot see that path.
          INERT='^(docs/|scripts/|\.github/|\.claude/|[^/]*\.md$|[^/]*\.(jpe?g|png)$|\.gitignore$)'

          CHANGED="$(git diff --name-only "$RANGE")"
          NOT_INERT="$(printf '%s\n' "$CHANGED" | grep -Ev "$INERT" || true)"

          if [ -n "$NOT_INERT" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "Running the full gate — these paths are not on the inert allowlist:"
            printf '%s\n' "$NOT_INERT" | sed 's/^/  /'
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "Every changed path is inert → skipping typecheck/lint/tests/build."
            # Say plainly what a green check does and does not mean here. A 15s pass asserts
            # "nothing the app gate can see changed" — NOT "the app is green".
            {
              echo "### verify: app steps skipped"
              echo ""
              echo "Every path in this change is on the inert allowlist, so typecheck, lint, the"
              echo "unit suite and the build were **not run**."
              echo ""
              echo "A green check here means **nothing the app gate can observe changed** — it is"
              echo "not a statement that the app is green. The last full run on the PR into \`main\` is."
              echo ""
              echo "Changed paths:"
              printf '%s\n' "$CHANGED" | sed 's/^/- `/;s/$/`/'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "--- all changed paths in $RANGE ---"
          printf '%s\n' "$CHANGED" | sed 's/^/  /'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.scope.outputs.app == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mos-app/package-lock.json

      - name: Install dependencies
        if: steps.scope.outputs.app == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.scope.outputs.app == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.scope.outputs.app == 'true'
        run: npm run lint:ci

      - name: Unit tests + coverage gate (≥80% changed lines)
        if: steps.scope.outputs.app == 'true'
        run: npm run test:coverage

      - name: Build full profile
        if: steps.scope.outputs.app == 'true'
        env:
          VITE_RELEASE_PROFILE: full
        run: npm run build

      - name: Café profile route and navigation reachability
        if: steps.scope.outputs.app == 'true'
        env:
          VITE_RELEASE_PROFILE: cafe
        run: npx vitest run src/shell/cafe-profile-reachability.test.tsx

      - name: Build Café profile
        if: steps.scope.outputs.app == 'true'
        env:
          VITE_RELEASE_PROFILE: cafe
        run: npm run build
