name: verify

on:
  push:
    branches: [main]
    # Prose-only commits cannot break the app. The PR trigger below is deliberately NOT
    # path-filtered — `verify` is a required status check, and a check skipped by a path filter
    # never reports, so the PR would block forever. PR-side savings come from the per-step
    # `steps.scope.outputs.app` guard instead, which still reports the check as green.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:

# Public repo: fork PRs run this workflow. Nothing here needs to write, so the token gets
# read-only. Actions are pinned to commit SHAs (tags are mutable — a hijacked v4 would run here).
permissions:
  contents: read

# Supersede in-flight runs on the same ref. Without this every push to a branch runs to
# completion even after the next push lands — 38 verify runs on 2026-07-30, several of them
# already-obsolete work. Never cancel on main: post-merge runs are the record that main is green.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: mos-app

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Need the base commit to diff against; the default shallow clone has only HEAD.
          fetch-depth: 0

      # Every step below costs ~170s and can only ever exercise mos-app/. On a commit that
      # touches none of it the run is pure latency AND a false-negative source: on 2026-07-30 a
      # scripts + pgTAP + docs commit went red on a flake in a React suite it could not have
      # affected. Skipping the steps (rather than the job) keeps the required check reporting.
      - name: Scope — does this change touch the app?
        id: scope
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Explicit refspec, not `git fetch origin <branch>`: the short form only updates the
            # remote-tracking ref when the configured refspec happens to cover it, so it can exit 0
            # while origin/<base> stays frozen — the same fail-open that bit scripts/pre-merge-check.sh.
            # Getting the base wrong here would silently skip the gate on a real app change.
            git fetch --quiet --no-tags origin \
              "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            BASE="origin/${{ github.base_ref }}"
            RANGE="$(git merge-base "$BASE" HEAD)..HEAD"
          else
            RANGE="${{ github.event.before }}..HEAD"
            git cat-file -e "${{ github.event.before }}" 2>/dev/null || RANGE="HEAD~1..HEAD"
          fi
          if git diff --name-only "$RANGE" -- mos-app/ | grep -q .; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "mos-app/ changed → running the full gate."
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "No mos-app/ changes in $RANGE → skipping typecheck/lint/tests/build."
            echo "Nothing here can affect the app; the check still reports green."
          fi
          git diff --name-only "$RANGE" | sed 's/^/  /'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.scope.outputs.app == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mos-app/package-lock.json

      - name: Install dependencies
        if: steps.scope.outputs.app == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.scope.outputs.app == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.scope.outputs.app == 'true'
        run: npm run lint:ci

      - name: Unit tests + coverage gate (≥80% changed lines)
        if: steps.scope.outputs.app == 'true'
        run: npm run test:coverage

      - name: Build
        if: steps.scope.outputs.app == 'true'
        run: npm run build
