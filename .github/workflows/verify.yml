name: verify

on:
  push:
    branches: [main]
  pull_request:

# Public repo: fork PRs run this workflow. Nothing here needs to write, so the token gets
# read-only. Actions are pinned to commit SHAs (tags are mutable — a hijacked v4 would run here).
permissions:
  contents: read

defaults:
  run:
    working-directory: mos-app

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mos-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:ci

      - name: Unit tests + coverage gate (≥80% changed lines)
        run: npm run test:coverage

      - name: Build
        run: npm run build
