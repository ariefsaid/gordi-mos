name: review-gate

# Checks that the whole review ROSTER reported on a change: spec, code-quality and security each
# recorded a verdict against the head commit. Evidence is a `<!-- review-gate -->` block in a PR
# comment — public, timestamped, and readable by CI, which is the point. The closed #240 looked for
# a ledger under the gitignored `docs/`, where only the author could ever see it.
#
# WHAT IT DELIBERATELY DOES NOT CHECK: who wrote the review. The first version compared the comment
# author's GitHub login against the PR author's, which on a one-collaborator repo can never differ —
# unsatisfiable by construction, and it never once refused a real review (#311). A login proves
# which token posted, never that anyone read the diff.
#
# So independence lives where it can actually be produced: role separation between three reviewers
# with different briefs and different failure modes. CI checks the part it can observe — that every
# lens reported, freshly. Whether the reviews were any good is judged by a human reading them, and
# the merge itself is a human checkpoint. See docs/agents/review.md.
#
# WHY NOT BRANCH PROTECTION. GitHub's "required approving reviews" is the natural home for the
# who-reviewed-it question and cannot work here for the same reason: one collaborator, and GitHub
# does not let a PR author approve their own pull request, so requiring an approval would make every
# PR unmergeable. Reviews here come from agents, which have no GitHub identity to approve with — so
# the verdict is recorded as text, and this reads it.
#
# COST. One job, ~20s, on three events: PR opened, each push, each new comment. The comment trigger
# is not optional — a review lands after the PR is opened, so without it the only way to go green
# would be to push another commit, which is backwards. `edited`/`deleted` are deliberately NOT
# watched: they roughly double the runs to re-check a case `synchronize` already covers.

on:
  pull_request_target:
    branches: [dev, main]
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # A push plus a comment in quick succession should settle on one answer, not race.
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  reviewed-by-someone-else:
    # issue_comment fires for plain issues too; only pull requests have a gate to run.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      # The gate comes from the BASE branch, never the PR head: a branch must not be able to rewrite
      # the control that judges it. Nothing from the head is checked out or executed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # On issue_comment there is no pull_request object, so the base ref is fetched from the
          # PR itself rather than falling back to the default branch — otherwise a dev-targeted PR
          # would be judged by main's copy of the gate on a comment and dev's on a push.
          ref: ${{ github.event.pull_request.base.ref || github.event.issue.pull_request && 'dev' || github.event.repository.default_branch }}
          persist-credentials: false

      # A control nobody has watched refuse is a belief. This runs only when the gate itself is
      # under change — `scripts/` is on verify.yml's INERT allowlist, so a scripts-only PR skips
      # verify entirely and this would otherwise be the one thing never tested.
      - name: Prove the in-force gate can still refuse
        run: |
          # Runs the BASE branch's copy of both script and suite — deliberately. This proves the
          # gate currently in force still refuses; it does NOT validate a PR's proposed changes to
          # the gate, which is what review of that PR is for. Said plainly because the previous
          # wording implied the opposite.
          bash scripts/review-gate.test.sh

      - name: Require a review by someone other than the author
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: bash scripts/review-gate.sh "$PR" "${{ github.repository }}"
