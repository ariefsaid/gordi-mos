name: review-gate

# Enforces the rule `/code-review` step 6 states and has never been able to check: a change is not
# merged on its author's own read. Evidence is a `<!-- review-gate -->` block in a PR comment —
# public, timestamped, and readable by CI, which is the point. The closed #240 looked for a ledger
# under the gitignored `docs/`, where only the author could ever see it.
#
# WHY NOT BRANCH PROTECTION. GitHub's "required approving reviews" is the natural home for this and
# cannot work here: the repo has ONE collaborator, and GitHub does not let a PR author approve their
# own pull request. Requiring one approval would make every PR unmergeable. Reviews here come from
# agents (luna, GLM, sub-agents), which have no GitHub identity to approve with — so the verdict has
# to be recorded as text, and this is what reads it.
#
# COST. One job, ~20s, on three events: PR opened, each push, each new comment. The comment trigger
# is not optional — a review lands after the PR is opened, so without it the only way to go green
# would be to push another commit, which is backwards. `edited`/`deleted` are deliberately NOT
# watched: they roughly double the runs to re-check a case `synchronize` already covers.

on:
  pull_request_target:
    branches: [dev, main]
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # A push plus a comment in quick succession should settle on one answer, not race.
  group: review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  reviewed-by-someone-else:
    # issue_comment fires for plain issues too; only pull requests have a gate to run.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      # The gate comes from the BASE branch, never the PR head: a branch must not be able to rewrite
      # the control that judges it. Nothing from the head is checked out or executed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          persist-credentials: false

      # A control nobody has watched refuse is a belief. This runs only when the gate itself is
      # under change — `scripts/` is on verify.yml's INERT allowlist, so a scripts-only PR skips
      # verify entirely and this would otherwise be the one thing never tested.
      - name: Prove the gate can still refuse
        if: github.event_name != 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          changed=$(gh pr diff "$PR" --repo "${{ github.repository }}" --name-only || true)
          case "$changed" in
            *scripts/review-gate*|*review-gate.yml*)
              echo "the gate is under change — running its refusal suite"
              bash scripts/review-gate.test.sh ;;
            *) echo "gate unchanged; skipping its self-test" ;;
          esac

      - name: Require a review by someone other than the author
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: bash scripts/review-gate.sh "$PR" "${{ github.repository }}"
