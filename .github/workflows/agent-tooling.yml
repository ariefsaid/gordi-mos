name: agent-tooling-self-tests
permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'adws/**'
      - 'scripts/**'
      - '.claude/**'
      - 'docs/agents/**'
      - '.githooks/**'
      - 'justfile'
      - '.env.sample'
      - 'supabase/applied-path-baseline'
      - '.github/workflows/guards.yml'
      - '.github/workflows/agent-tooling.yml'
  workflow_dispatch:

jobs:
  agent-tooling-self-tests:
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'staging' && github.head_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: pre-commit hook self-test
        run: bash scripts/pre-commit-hook.test.sh
      - name: pre-push hook self-test
        run: bash scripts/pre-push-hook.test.sh
      - name: agent git shim self-test
        run: bash scripts/agent-git-shim.test.sh
      - name: pre-pr-verify self-test
        run: bash scripts/pre-pr-verify.test.sh
      - name: MVP handoff preflight self-test
        run: bash scripts/mvp-handoff-preflight.test.sh
      - name: Impeccable detector vendor self-test
        run: bash scripts/impeccable-detector.test.sh
      - name: Impeccable side-stripe rule self-test
        run: bash scripts/impeccable-side-stripe.test.sh
      - name: UI review skill pin self-test
        run: bash scripts/vendor-skills.test.sh
      - name: UI skill runtime resolver self-test
        run: bash scripts/ui-skill-tools.test.sh
      - name: sssf vendor conformance self-test (FAC-001)
        run: bash scripts/vendor-sssf.test.sh
      - name: sssf gate composition + chain-exit self-test (FAC-004/FAC-005)
        run: bash scripts/sssf-gate.test.sh
      - name: sssf roster config self-test (FR-007)
        run: bash scripts/sssf-config.test.sh
      - name: sssf lock-wrapper self-test (re-entrancy + mutual exclusion)
        run: bash scripts/sssf-locks.test.sh
      - name: sssf timed-out quality check self-test (#389)
        run: bash scripts/sssf-quality-timeout.test.sh
      - name: sssf design-audit chain self-test (#350)
        run: bash scripts/sssf-design-audit.test.sh
      - name: quantitative design-audit harness self-test (#quant-ui)
        run: bash scripts/design-quality-audit.test.sh
      - name: sssf provider-fault vs model-fault self-test (#386)
        run: bash scripts/sssf-provider-error.test.sh
      - name: kitchen history import self-test (#349)
        run: bash scripts/import-kitchen-history.test.sh
      - name: ESB push worker test-data + dispatch self-test (#134, FR-084, FR-053)
        run: bash scripts/esb-worker.test.sh
      - name: reporting snapshot job self-test (#133)
        run: bash scripts/reporting-snapshot.test.sh
      - name: applied-path harness self-test (#393)
        run: bash scripts/applied-path-check.test.sh
      - name: e2e-takes-the-db-lock self-test (#388)
        run: bash scripts/e2e-db-lock.test.sh
      - name: gh-post posting-policy + PR-stamp self-test
        run: bash scripts/gh-post.test.sh
      - name: record-review independent-review stamp self-test
        run: bash scripts/record-review.test.sh
      - name: lane-exempt audit-trail self-test
        run: bash scripts/lane-exempt.test.sh
      - name: cloud sandbox tool helpers self-test
        run: bash scripts/cloud-tools.test.sh
      - name: drive-next ticket-picker self-test
        run: bash scripts/drive-next.test.sh
      - name: commit-msg essay-cap self-test
        run: bash scripts/commit-msg-cap.test.sh
      - name: prose-budget comment-essay self-test
        run: bash scripts/prose-budget.test.sh
      - name: drive-decay backlog-rot self-test
        run: bash scripts/drive-decay.test.sh
      - name: release-evidence package self-test
        run: bash scripts/release-evidence.test.sh
      - name: drive-burn report self-test
        run: bash scripts/drive-burn.test.sh
      - name: drive-clock report self-test
        run: bash scripts/drive-clock.test.sh
      - name: worktree-cleanup sweep self-test
        run: bash scripts/worktree-cleanup.test.sh
      - name: carry-stamps pure-rebase self-test
        run: bash scripts/carry-stamps.test.sh
      - name: gh-shim PATH firewall self-test
        run: bash scripts/gh-shim.test.sh
      - name: factory-run shim-carrier self-test
        run: bash scripts/factory-run.test.sh
      - name: worktree npm-seed hardlink self-test
        run: bash scripts/worktree-npm-seed.test.sh
      - name: ci-e2e fair-use dispatch door self-test
        run: bash scripts/ci-e2e.test.sh
      - name: staging deploy script self-test
        run: bash scripts/deploy-staging.test.sh
      - name: operations scripts self-tests (snapshot cron, ops check, backup, production deploy)
        run: |
          bash scripts/reporting-snapshot-cron.test.sh
          bash scripts/ops-check.test.sh
          bash scripts/db-backup.test.sh
          bash scripts/deploy-production.test.sh
