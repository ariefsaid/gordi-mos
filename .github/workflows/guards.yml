name: guard-self-tests
# Product-relevant checks report on every PR; the required status check never path-skips.
permissions:
  contents: read

on:
  pull_request:
  workflow_dispatch:

jobs:
  guard-self-tests:
    if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'staging' && github.head_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Impeccable changed production UI scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/impeccable-changed-ui.sh "${BASE_SHA:-HEAD^}"
      - name: migration order guard self-test (#1110)
        run: bash scripts/check-migration-order.test.sh
      - name: Migration order — new versions must be newer than the base's latest (#1110)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          bash scripts/check-migration-order.sh "origin/${BASE_REF}"
      - name: review read-only and served-preview self-tests
        run: node --test scripts/review-read-only.test.mjs scripts/preview-preflight.test.mjs scripts/check-chunk-cycles.test.mjs
      - name: seed dates are WIB, not UTC self-test (#459)
        run: bash scripts/seed-wib-dates.test.sh
      - name: SECURITY DEFINER revoke lint self-test
        run: bash scripts/lint-security-definer.test.sh
      - name: API docs freshness self-test
        run: bash scripts/api-reference.test.sh
      - name: mos command-line client self-test (#1117)
        run: node --test scripts/mos.test.mjs
      - name: MCP catalog generator self-test
        run: bash scripts/mcp-catalog.test.sh
      - name: statement-timeout check self-test
        run: bash scripts/check-statement-timeout.test.sh
      - name: Supabase CLI version pin self-test
        run: bash scripts/check-supabase-cli-version.test.sh
      - name: Supabase CLI version pins
        run: bash scripts/check-supabase-cli-version.sh
