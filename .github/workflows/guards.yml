name: guard-self-tests
# Every guard ships with its own self-test, and the self-tests run in CI — a guard
# whose test never runs is a control everyone believes is running.
#
# ALWAYS-RUN on every PR (no paths filter): this check is REQUIRED, and a required check
# skipped by a path filter never reports, so the PR would block forever (verify.yml documents
# the same trap). The whole suite is <1 min — cheaper than the deadlock. The old paths list
# is kept below as documentation of what the suite guards, not as a trigger.
on:
  pull_request:
  workflow_dispatch:
    # (former trigger paths, now documentation:)
    # - '.githooks/**'
    # - 'scripts/agent-git-shim/**'
    # - 'scripts/pre-pr-verify.sh'
    # # the drive-loop gates (OD-WAY-80): an edit to a guard must re-run its self-test
    # - 'scripts/gh-post.sh'
    # - 'scripts/record-review.sh'
    # - 'scripts/lane-exempt.sh'
    # - 'scripts/drive-next.sh'
    # - 'scripts/prose-budget.sh'
    # - 'scripts/drive-decay.sh'
    # - 'scripts/release-evidence.sh'
    # - 'scripts/drive-burn.sh'
    # - 'scripts/drive-clock.sh'
    # - 'scripts/*.test.sh'
    # # shared shell the self-tests source (py-with-deps.sh) or exec (flock-run.sh):
    # # a change there changes what those tests actually run, so re-run them.
    # - 'scripts/lib/**'
    # - 'scripts/import-kitchen-history.py'
    # # the seeds themselves (#459): seed-wib-dates.test.sh exists to catch a seed reverting to
    # # UTC current_date, and that revert touches supabase/ ONLY — without this the lane would not
    # # even start for the exact regression the guard guards. Registering the step is half the job;
    # # the trigger is the other half.
    # - 'supabase/seed*.sql'
    # # the ESB push worker (#134): its self-test is what proves a real ERP identifier
    # # cannot reach the shared vendor sandbox, and that a rehearsal cannot mark a log
    # # posted — so a change to any of the three re-runs it.
    # - 'scripts/esb-worker.py'
    # - 'scripts/*.test.py'
    # # the nightly snapshot job and its unit suite — the suite owns an acceptance criterion
    # # (a run declares the org it writes), so a change to either has to re-run it.
    # # NOTE: test_reporting_snapshot.py does NOT match 'scripts/*.test.py' above — the
    # # underscore form needs its own entry, which is why both lists are here.
    # - 'scripts/reporting_snapshot.py'
    # - 'scripts/reporting_local_env.py'
    # - 'scripts/test_reporting_snapshot.py'
    # - 'scripts/setup-hooks.sh'
    # # the applied-path harness (#393): its self-test is what proves the deployed-database
    # # check can still fail, so a change to the harness, its fingerprint, or the commit it
    # # treats as deployed re-runs it. `scripts/*.test.sh` above only covers the test file.
    # # Re: the fingerprint SQL specifically — this self-test has no Postgres to run it against,
    # # so it only checks the file PARSES (comments/strings stripped, parens balance, real
    # # content present); it does not execute it. Real execution coverage is the integration and
    # # geometry lanes, which boot a stack and run this file for real (#472).
    # - 'scripts/applied-path-check.sh'
    # - 'scripts/lib/applied-path-fingerprint.sql'
    # - 'supabase/applied-path-baseline'
    # - '.github/workflows/guards.yml'
    # # sssf vendor conformance (FAC-001, #334): any touch of the vendored factory
    # # skeleton or its stamp re-proves byte-identity against the upstream pin.
    # - 'scripts/vendor-skills.sh'
    # - 'adws/**'
    # - '.env.sample'
    # - 'justfile'
jobs:
  guard-self-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: pre-commit hook self-test
        run: bash scripts/pre-commit-hook.test.sh
      - name: pre-push hook self-test
        run: bash scripts/pre-push-hook.test.sh
      - name: agent git shim self-test
        run: bash scripts/agent-git-shim.test.sh
      - name: pre-pr-verify self-test
        run: bash scripts/pre-pr-verify.test.sh
      - name: sssf vendor conformance self-test (FAC-001)
        run: bash scripts/vendor-sssf.test.sh
      - name: sssf gate composition + chain-exit self-test (FAC-004/FAC-005)
        run: bash scripts/sssf-gate.test.sh
      - name: sssf roster config self-test (FR-007)
        run: bash scripts/sssf-config.test.sh
      - name: sssf lock-wrapper self-test (re-entrancy + mutual exclusion)
        run: bash scripts/sssf-locks.test.sh
      - name: sssf timed-out quality check self-test (#389)
        run: bash scripts/sssf-quality-timeout.test.sh
      - name: sssf design-audit chain self-test (#350)
        run: bash scripts/sssf-design-audit.test.sh
      - name: sssf provider-fault vs model-fault self-test (#386)
        run: bash scripts/sssf-provider-error.test.sh
      - name: kitchen history import self-test (#349)
        run: bash scripts/import-kitchen-history.test.sh
      - name: ESB push worker test-data + dispatch self-test (#134, FR-084, FR-053)
        run: bash scripts/esb-worker.test.sh   # section G runs esb-worker-dispatch.test.py
      - name: reporting snapshot job self-test (#133)
        run: bash scripts/reporting-snapshot.test.sh
      - name: applied-path harness self-test (#393)
        # Behavioural: it builds a throwaway git repo and stubs the database, so it needs no
        # Docker. Section H guts the harness and requires the suite to notice. Section U parses
        # the fingerprint SQL (no Postgres here to execute it against — the integration/geometry
        # lanes do that for real).
        run: bash scripts/applied-path-check.test.sh
      - name: e2e-takes-the-db-lock self-test (#388)
        run: bash scripts/e2e-db-lock.test.sh
      - name: seed dates are WIB, not UTC self-test (#459)
        run: bash scripts/seed-wib-dates.test.sh
      - name: gh-post posting-policy + PR-stamp self-test
        run: bash scripts/gh-post.test.sh
      - name: record-review independent-review stamp self-test
        run: bash scripts/record-review.test.sh
      - name: lane-exempt audit-trail self-test
        run: bash scripts/lane-exempt.test.sh
      - name: drive-next ticket-picker self-test
        run: bash scripts/drive-next.test.sh
      - name: commit-msg essay-cap self-test
        run: bash scripts/commit-msg-cap.test.sh
      - name: prose-budget comment-essay self-test
        run: bash scripts/prose-budget.test.sh
      - name: drive-decay backlog-rot self-test
        run: bash scripts/drive-decay.test.sh
      - name: release-evidence package self-test
        run: bash scripts/release-evidence.test.sh
      - name: drive-burn report self-test
        run: bash scripts/drive-burn.test.sh
      - name: drive-clock report self-test
        run: bash scripts/drive-clock.test.sh
      - name: worktree-cleanup sweep self-test
        run: bash scripts/worktree-cleanup.test.sh
      - name: carry-stamps pure-rebase self-test
        run: bash scripts/carry-stamps.test.sh
      - name: gh-shim PATH firewall self-test
        run: bash scripts/gh-shim.test.sh
      - name: factory-run shim-carrier self-test
        run: bash scripts/factory-run.test.sh
      - name: worktree npm-seed hardlink self-test
        run: bash scripts/worktree-npm-seed.test.sh
      - name: SECURITY DEFINER revoke lint self-test
        run: bash scripts/lint-security-definer.test.sh
