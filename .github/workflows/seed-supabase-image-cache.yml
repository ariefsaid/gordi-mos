name: seed-supabase-image-cache

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-image-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check whether the Supabase image cache exists
        id: supabase-images
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SUPABASE_IMAGE_CACHE_KEY: supabase-images-${{ runner.os }}-2.104.0-${{ hashFiles('supabase/config.toml') }}
        with:
          path: /tmp/supabase-images.tar
          key: ${{ env.SUPABASE_IMAGE_CACHE_KEY }}
          lookup-only: true

      - name: Pull and archive Supabase images
        if: steps.supabase-images.outputs.cache-hit != 'true'
        run: bash scripts/supabase-image-cache.sh pull

      - name: Save Supabase image cache
        if: steps.supabase-images.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SUPABASE_IMAGE_CACHE_KEY: supabase-images-${{ runner.os }}-2.104.0-${{ hashFiles('supabase/config.toml') }}
        with:
          path: /tmp/supabase-images.tar
          key: ${{ env.SUPABASE_IMAGE_CACHE_KEY }}
