name: geometry

# ─── WHY THIS LANE EXISTS ──────────────────────────────────────────────────────────────────
# The rendered-geometry guards (mos-app/e2e/guards.geometry.spec.ts) are the only checks in the
# repo that measure a REAL box — split-view parity, the 44×44 phone tap floor, the 8px separation
# between adjacent targets, the café search's usable measure. Before this lane existed they ran
# ONLY in integration.yml's `db` job, which is gated `github.event_name == 'push' || base_ref ==
# 'main'`. So on a PR → dev — where nearly all work lands — they never executed. #403 shipped an
# auth tap floor whose whole claim was "guarded by rendered geometry" and the guard could not run
# in the lane the merge went through. Same failure guards.yml already names: "a guard whose test
# never runs is a control everyone believes is running."
#
# ⚠️ NOT YET A REQUIRED CHECK. `dev`'s only required status check is `verify`. Until an admin adds
# `geometry` to dev's branch protection this reports but does not block. The structural twin that
# DOES gate — mos-app/src/components/ui/tap-targets.css.test.ts, in `verify` — asserts both axes
# of the 44px floor against the CSS source, so the floor is never resting on this lane alone.
#
# ─── #565: ALSO THE DEV-PR pgTAP + APPLIED-PATH LANE ───────────────────────────────────────
# This job used to boot Supabase for the geometry guards ALONE, while integration.yml's `pgtap`
# job separately booted Supabase for pgTAP + the applied-path check (#393) — both on the same
# dev PR, in parallel, each paying the ~84s boot + (this job's) npm ci + Playwright install. That
# `pgtap` job is gone; its two checks (`supabase test db`, `scripts/applied-path-check.sh`) now
# run here, after the same boot, before the rendered-geometry guards. One boot, one lint, both
# check groups — see the scope step below for exactly which changes make this run.

on:
  # Deliberately NOT path-filtered, for the same reason verify.yml is not: a check skipped by a
  # path filter never reports, so the day this becomes required a docs-only PR would block
  # forever. PR-side savings come from the `scope` step below, which still reports green.
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geometry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # this job runs pgTAP + the applied-path check in addition to the geometry guards
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # FAIL-CLOSED BY CONSTRUCTION, copied from verify.yml's reasoning: skip only when EVERY
      # changed path is on the inert allowlist. Anything unrecognised — including any new
      # top-level directory — boots the stack. An out-of-date allowlist costs a wasted run, never
      # an unrun gate. Note what is NOT inert here and IS inert in verify.yml: supabase/, because
      # these guards render the seeded app and a seed/migration change can move real pixels.
      #
      # #565: this now also gates the pgTAP + applied-path checks this job absorbed from the old
      # `pgtap` job, whose own trigger was a POSITIVE path filter (supabase/**, mos-app/e2e/**,
      # mos-app/playwright.config.*, mos-app/package-lock.json, plus the two applied-path harness
      # files). Every one of those is already non-inert under INERT below EXCEPT the two harness
      # files, which sit under scripts/ — inert here on purpose (scripts/ ships no pixels) but the
      # applied-path check's own inputs, so they get an explicit carve-out. Net effect: this job
      # runs at least everywhere either old job did (no regression), and additionally on any
      # non-inert app change that isn't supabase/e2e-shaped (e.g. plain mos-app/src/** UI code) —
      # widening where pgTAP/applied-path run, never narrowing where either used to run.
      - name: Scope — can this change move a rendered pixel, or does it feed pgTAP/applied-path?
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --quiet --no-tags origin \
              "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            RANGE="$(git merge-base "origin/${BASE_REF}" HEAD)..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          # Extended 2026-09-01: the gate-era surfaces (scripts/, hooks, CI defs, contracts, justfile)
          # ship no pixels — every guard PR was paying ~3 min of screenshots (owner audit of the
          # gates' own spend). Same inert-allowlist polarity as pre-pr-verify's local scope.
          INERT='^(docs/|review/|adws/|\.claude/|scripts/|agents/|\.githooks/|\.github/|justfile$|\.env\.sample$|[^/]*\.md$|[^/]*\.(jpe?g|png)$|\.gitignore$)'
          CHANGED="$(git diff --name-only "$RANGE")"
          NOT_INERT="$(printf '%s\n' "$CHANGED" | grep -Ev "$INERT" || true)"
          # Carve-out: the applied-path harness's own inputs (#393) live under scripts/, which is
          # otherwise inert here — a change to THESE two files must still run, even though nothing
          # else in scripts/ would.
          APPLIED_PATH_INPUTS="$(printf '%s\n' "$CHANGED" | grep -E '^scripts/(applied-path-check\.sh|lib/applied-path-fingerprint\.sql)$' || true)"
          if [ -n "$NOT_INERT" ] || [ -n "$APPLIED_PATH_INPUTS" ]; then
            echo "render=true" >> "$GITHUB_OUTPUT"
            echo "Running the DB checks — these paths are not inert:"
            printf '%s\n' "$NOT_INERT" "$APPLIED_PATH_INPUTS" | sed '/^$/d;s/^/  /'
          else
            echo "render=false" >> "$GITHUB_OUTPUT"
            {
              echo "### geometry: DB checks skipped"
              echo ""
              echo "Every changed path is inert (prose/config that cannot move a rendered pixel or"
              echo "affect the schema), so pgTAP, the applied-path check, and the geometry guards"
              echo "were **not run**. A green check here means *nothing renderable or DB-relevant"
              echo "changed* — not that the DB or geometry is green."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Supabase CLI
        if: steps.scope.outputs.render == 'true'
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.104.0

      - name: Start local Supabase stack (applies migrations + seed)
        if: steps.scope.outputs.render == 'true'
        # Same exclusion list as integration.yml — proven to boot. auth/rest/kong are needed to
        # log the guards in; inbucket is needed by the AC-005 recovery round-trip.
        run: supabase start -x edge-runtime,functions,studio,meta,imgproxy,storage,realtime,vector,analytics

      # ─── absorbed from the old `pgtap` job (#565) — see scripts/lint-security-definer.sh for
      # what this checks; `db` in integration.yml runs the same script on the PR→main lane. ────
      - name: Lint — every SECURITY DEFINER migration must revoke PUBLIC execute
        if: steps.scope.outputs.render == 'true'
        run: bash scripts/lint-security-definer.sh

      - name: pgTAP suite
        if: steps.scope.outputs.render == 'true'
        run: supabase test db

      # #393. Everything above starts from nothing, so every conditional migration has a branch
      # CI structurally cannot reach. This builds a database from the DEPLOYED commit's tree,
      # runs the real migration chain over it, and asserts the result is indistinguishable from
      # a fresh reset. Exit 2 means the check could not run meaningfully — treat it as red.
      # No `--prove` here (that stays on the `db` job, PR→main): this is the fast lane.
      - name: Applied-path check — a migrated database matches a fresh one (#393)
        if: steps.scope.outputs.render == 'true'
        run: bash scripts/applied-path-check.sh --out artifacts/applied-path

      - name: Upload applied-path artifacts on failure
        if: failure() && steps.scope.outputs.render == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: geometry-applied-path
          path: artifacts/applied-path/
          retention-days: 7

      - name: Export Supabase env to GITHUB_ENV
        if: steps.scope.outputs.render == 'true'
        run: |
          supabase status -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|API_URL)=' | tr -d '"' >> "$GITHUB_ENV"
          grep -q '^SERVICE_ROLE_KEY=eyJ' "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.scope.outputs.render == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mos-app/package-lock.json

      - name: Install app dependencies
        if: steps.scope.outputs.render == 'true'
        working-directory: mos-app
        run: npm ci

      - name: Cache Playwright browsers
        if: steps.scope.outputs.render == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('mos-app/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.scope.outputs.render == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: mos-app
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.scope.outputs.render == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: mos-app
        run: npx playwright install-deps chromium

      - name: Rendered-geometry guards
        if: steps.scope.outputs.render == 'true'
        working-directory: mos-app
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:44321
          VITE_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          VITE_SHOW_PLAN_BUDGET: 'true'
        # auth-recovery.spec.ts is here for ONE reason: the set-password card is reachable only
        # through its mailpit round-trip, so the fifth auth surface's tap floor is asserted inside
        # AC-005 rather than in a second copy of that journey. Adding it costs one already-written
        # test on an already-booted stack.
        run: npx playwright test e2e/guards.geometry.spec.ts e2e/auth-recovery.spec.ts

      - name: Upload Playwright report on failure
        if: failure() && steps.scope.outputs.render == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: geometry-playwright-report
          path: mos-app/playwright-report/
          retention-days: 7

      - name: Stop stack
        if: always() && steps.scope.outputs.render == 'true'
        run: supabase stop
