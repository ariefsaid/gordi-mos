name: db-contracts

# ─── WHY THIS LANE EXISTS ──────────────────────────────────────────────────────────────────
# The database contracts a dev PR must not break: RLS and role behaviour (pgTAP), the rule that a
# SECURITY DEFINER function revokes PUBLIC execute, and the proof that a migrated database matches
# a freshly built one (#393). One Supabase boot serves all three (#565).
#
# NO BROWSER RUNS HERE. A dev PR gets `verify` (unit, types, lint) plus these database contracts;
# anything that renders a page is a PR → main gate, in integration.yml, which runs the whole
# Playwright suite — rendered-geometry guards included. That seam is the sibling project's: its
# `pgtap` job is `base_ref == 'dev'` and its `integration` job is `base_ref == 'main'`, and no
# dev PR installs a browser. This lane had drifted across it, paying a Chromium install and a
# browser run on every dev PR for guards that main gates anyway (owner ruling).
#
# What that trade costs, stated plainly: a composition regression now reaches dev unmeasured and
# is caught at the release boundary instead. The 44px floor does not rest on the browser either
# way — mos-app/src/components/ui/tap-targets.css.test.ts asserts both axes against the CSS
# source inside `verify`, which IS required.
#
# REQUIRED CHECK on `dev`, alongside `verify` and `guard-self-tests`; it reports on every PR.

on:
  # Deliberately NOT path-filtered, for the same reason verify.yml is not: a check skipped by a
  # path filter never reports, so the day this becomes required a docs-only PR would block
  # forever. PR-side savings come from the `scope` step below, which still reports green.
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Supabase boot + pgTAP + the applied-path check; no browser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A migration added by this PR must sort after every migration already on the base branch
      # (#1110). Runs before the scope step so a scope skip cannot bypass it.
      - name: Migration order — new versions must be newer than the base's latest
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --quiet --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          bash scripts/check-migration-order.sh "origin/${BASE_REF}"

      # POSITIVE LIST: run the DB steps only when the change touches something they read; every
      # other path (mos-app/src/**, docs, prose) skips them, and the job still reports green.
      # Inputs: supabase/** (migrations, seeds, pgTAP, config, the generated MCP catalog),
      # api-docs/reference.md (the generated API reference), mos-app/e2e/**, mos-app/package-lock.json,
      # mos-app/playwright.config.*, the scripts those steps run (and their scripts/lib/ helpers),
      # and this workflow. A new path nobody listed skips; add it here when a step starts reading it.
      - name: Scope — does this change feed pgTAP or the applied-path check?
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --quiet --no-tags origin \
              "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
            RANGE="$(git merge-base "origin/${BASE_REF}" HEAD)..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          # A manual dispatch is an explicit request to exercise the DB lane.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DB_INPUTS='workflow_dispatch'
          else
            DB_INPUTS="$(bash scripts/db-contracts-scope.sh "$RANGE")"
          fi
          if [ -n "$DB_INPUTS" ]; then
            echo "render=true" >> "$GITHUB_OUTPUT"
            echo "Running the DB checks — these paths feed them:"
            printf '%s\n' "$DB_INPUTS" | sed '/^$/d;s/^/  /'
          else
            echo "render=false" >> "$GITHUB_OUTPUT"
            {
              echo "### db-contracts: DB checks skipped"
              echo ""
              echo "No changed path feeds pgTAP or the applied-path check, so they were **not run**."
              echo "A green check here means *nothing DB-relevant changed* — not that the DB is green."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install Supabase CLI
        if: steps.scope.outputs.render == 'true'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.104.0

      - name: Cache local Supabase images
        if: steps.scope.outputs.render == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: supabase-images
        env:
          SUPABASE_IMAGE_CACHE_KEY: supabase-images-${{ runner.os }}-2.104.0-${{ hashFiles('supabase/config.toml') }}
        with:
          path: /tmp/supabase-images.tar
          key: ${{ env.SUPABASE_IMAGE_CACHE_KEY }}

      - name: Load cached Supabase images
        if: steps.scope.outputs.render == 'true' && steps.supabase-images.outputs.cache-hit == 'true'
        run: bash scripts/supabase-image-cache.sh load

      - name: Start local Supabase stack (applies migrations + seed)
        if: steps.scope.outputs.render == 'true'
        # Same exclusion list as integration.yml — proven to boot. auth/rest/kong are needed to
        # log the guards in; inbucket is needed by the AC-005 recovery round-trip.
        run: bash scripts/supabase-start-retry.sh edge-runtime,functions,studio,meta,imgproxy,storage,realtime,vector,analytics

      - name: Save Supabase images for later runs
        if: success() && steps.scope.outputs.render == 'true' && steps.supabase-images.outputs.cache-hit != 'true'
        run: bash scripts/supabase-image-cache.sh save

      # ─── absorbed from the old `pgtap` job (#565) — see scripts/lint-security-definer.sh for
      # what this checks; `db` in integration.yml runs the same script on the PR→main lane. ────
      - name: Lint — every SECURITY DEFINER migration must revoke PUBLIC execute
        if: steps.scope.outputs.render == 'true'
        run: bash scripts/lint-security-definer.sh

      - name: API reference matches the database
        if: steps.scope.outputs.render == 'true'
        run: bash scripts/api-reference.sh --check

      - name: MCP tool catalog matches the database
        if: steps.scope.outputs.render == 'true'
        run: bash scripts/mcp-catalog.sh --check

      - name: pgTAP suite
        if: steps.scope.outputs.render == 'true'
        run: supabase test db

      # pgTAP cannot load a file outside supabase/tests, so the sample-org Money seed's second run
      # and its refusal are checked here: a rerun must add nothing (reporting_08's exact counts
      # still hold), and a database holding a non-fixture person must refuse it.
      - name: Sample-org Money seed — a second run adds nothing, a non-fixture person refuses it
        if: steps.scope.outputs.render == 'true'
        run: |
          seed=supabase/seed.sample-org-money.sql
          db="supabase_db_$(sed -n 's/^project_id *= *"\(.*\)"/\1/p' supabase/config.toml | head -1)"
          psql_db() { docker exec -i "$db" psql -U postgres -d postgres -X -q -v ON_ERROR_STOP=1 -f -; }
          psql_db < "$seed" > rerun.log 2>&1 || { cat rerun.log; exit 1; }
          grep -q 'seed.sample-org-money: org .*, 0 revenue and 0 margin rows added' rerun.log \
            || { echo "the second run wrote rows:"; cat rerun.log; exit 1; }
          if { echo 'begin;'
               echo "insert into shared.people (org_id, full_name, email) select org_id, 'Not a fixture', 'person@realorg.invalid' from shared.people where email like '%.dev@example.test' limit 1;"
               cat "$seed"
               echo 'rollback;'; } | psql_db > refusal.log 2>&1; then
            echo "the seed ran in a database holding a non-fixture person:"; cat refusal.log; exit 1
          fi
          grep -q 'seed.sample-org-money: refused' refusal.log || { cat refusal.log; exit 1; }
          supabase test db supabase/tests/reporting_08_sample_money_seed.sql

      # The sample-org ESB catalog load is tested by a file that includes the seed, which pgTAP
      # cannot do (see the Money step above), so it runs here in the DB container, rollback-only.
      - name: Sample-org ESB catalog seed — copy, rerun and refusals (rollback-only)
        if: steps.scope.outputs.render == 'true'
        run: |
          db="supabase_db_$(sed -n 's/^project_id *= *"\(.*\)"/\1/p' supabase/config.toml | head -1)"
          docker cp supabase/seed.sample-org-esb-catalog.sql "$db:/tmp/seed.sample-org-esb-catalog.sql"
          docker exec "$db" mkdir -p /tmp/seed-tests
          docker cp supabase/seed-tests/ops_28_sample_org_esb_catalog.sql "$db:/tmp/seed-tests/ops_28_sample_org_esb_catalog.sql"
          out=$(docker exec "$db" psql -U postgres -d postgres -X -A -t -v ON_ERROR_STOP=1 -f /tmp/seed-tests/ops_28_sample_org_esb_catalog.sql) \
            || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Fxq '1..36'
          test "$(printf '%s\n' "$out" | grep -Ec '^ok [0-9]+ -')" -eq 36
          if printf '%s\n' "$out" | grep -q '^not ok '; then exit 1; fi

      - name: Sample-org item settings seed — prefill, rerun and refusals (rollback-only)
        if: steps.scope.outputs.render == 'true'
        run: |
          db="supabase_db_$(sed -n 's/^project_id *= *"\(.*\)"/\1/p' supabase/config.toml | head -1)"
          docker cp supabase/seed.sample-org-item-settings.sql "$db:/tmp/seed.sample-org-item-settings.sql"
          docker exec "$db" mkdir -p /tmp/seed-tests
          docker cp supabase/seed-tests/ops_29_sample_org_item_settings.sql "$db:/tmp/seed-tests/ops_29_sample_org_item_settings.sql"
          out=$(docker exec "$db" psql -U postgres -d postgres -X -A -t -v ON_ERROR_STOP=1 -f /tmp/seed-tests/ops_29_sample_org_item_settings.sql) \
            || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Fxq '1..28'
          test "$(printf '%s\n' "$out" | grep -Ec '^ok [0-9]+ -')" -eq 28
          if printf '%s\n' "$out" | grep -q '^not ok '; then exit 1; fi

      # #393. Everything above starts from nothing, so every conditional migration has a branch
      # CI structurally cannot reach. This builds a database from the DEPLOYED commit's tree,
      # runs the real migration chain over it, and asserts the result is indistinguishable from
      # a fresh reset. Exit 2 means the check could not run meaningfully — treat it as red.
      # No `--prove` here (that stays on the `db` job, PR→main): this is the fast lane.
      - name: Applied-path check — a migrated database matches a fresh one (#393)
        if: steps.scope.outputs.render == 'true'
        run: bash scripts/applied-path-check.sh --out artifacts/applied-path

      # Keep this as the last database-mutating check: rollback/reapply leaves the stack at the
      # migrated schema, while earlier DB assertions should see the pristine reset state.
      - name: Prove executable migration rollbacks
        if: steps.scope.outputs.render == 'true'
        env:
          BASE_REF: ${{ github.base_ref || 'dev' }}
        run: |
          git check-ref-format "refs/heads/${BASE_REF}"
          git fetch --quiet --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          db="supabase_db_$(sed -n 's/^project_id *= *"\(.*\)"/\1/p' supabase/config.toml | head -1)"
          bash scripts/prove-migration-rollbacks.sh "origin/${BASE_REF}" "$db"

      - name: Upload applied-path artifacts on failure
        if: failure() && steps.scope.outputs.render == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: geometry-applied-path
          path: artifacts/applied-path/
          retention-days: 7

      - name: Stop stack
        if: always() && steps.scope.outputs.render == 'true'
        run: supabase stop
