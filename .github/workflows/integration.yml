name: integration

on:
  push:
    branches: [main]
  # integration is PR→main ONLY (PMO convention: dev/feature PRs run just `verify` + `geometry`;
  # the heavy full-stack gate belongs to the dev→main promotion PR + the post-merge push-to-main
  # smoke). On main-targeted PRs the job still runs ONLY when something it validates changes — DB/
  # migrations/RLS, the e2e journeys, or this workflow's deps. Pushes to main always run it
  # (no paths filter on push), so every merge is fully validated post-merge.
  pull_request:
    # The heavy `db` job is PR→main only; it is gated on base_ref, not on this list.
    branches: [main]
    paths:
      - 'supabase/**'
      - 'mos-app/e2e/**'
      - 'mos-app/playwright.config.*'
      - 'mos-app/package-lock.json'
      # The deployed-database harness (#393). `scripts/**` is otherwise absent from this filter,
      # which is how the first version of this check shipped without ever running: the workflow
      # simply did not trigger on it.
      - 'scripts/applied-path-check.sh'
      - 'scripts/lib/applied-path-fingerprint.sql'
      # NB: edits to THIS workflow are validated by the always-run push-to-main trigger
      # (kept out of the PR paths filter so a workflow-only PR doesn't boot the full stack).

# ─── CI TIERING ─────────────────────────────────────────────────────────────────────────────
# PR → dev    `verify` + `geometry` — ONE Supabase boot: pgTAP + applied-path + rendered-geometry
#             guards, no Playwright e2e suite. Fast lane, lives in geometry.yml (#565).
# PR → main   `verify` + `db`       — Supabase + pgTAP + Playwright e2e. Authoritative gate.
# push main   `verify` + `db`       — post-merge smoke.
#
# HISTORY. Until now gordi had no DB test on dev PRs at all: `integration` was PR→main only, so
# PRs #113–#117 ran `verify` alone and the 637 pgTAP tests — including every assertion written for
# the M-1/M-2 security remediation — had never executed in CI. A migration that broke RLS could
# sit undetected on `dev` for days. A `pgtap` job here (branches: [main, dev]) was the fix, then
# geometry.yml grew its OWN dev-PR Supabase boot for the rendered-geometry guards (#403) — the two
# booted Supabase, npm-ci'd and ran in parallel on the same PR. #565 merged the `pgtap` job into
# geometry.yml's job (still named `geometry`, still one dev-PR check) so a dev PR boots the stack
# once and runs both check groups. `db` here is untouched: it is the PR→main / push-main lane and
# was never part of the duplication.

# Public repo: fork PRs run this workflow. Nothing here needs to write, so the token gets
# read-only. Actions are pinned to commit SHAs (tags are mutable — a hijacked v4 would run here).
permissions:
  contents: read

# Supersede in-flight runs on the same ref — this is the expensive workflow (median ~4 min,
# dominated by an 84s Supabase boot), so letting an obsolete run finish is the costliest waste
# here. Never cancel on main: the post-merge run is the record that main is fully validated.
concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── AUTHORITATIVE GATE: PR → main, and the post-merge smoke on main. ──────────────────────
  # The dev-PR fast lane (formerly the `pgtap` job here) now lives in geometry.yml's `geometry`
  # job (#565) — merged with the rendered-geometry guards so a dev PR boots Supabase once
  # instead of twice. This job is unaffected: it was never part of that duplication.
  db:
    # Gated on base_ref rather than the trigger's branch list, so this job's condition alone
    # decides whether the expensive browser tier runs — it cannot accidentally start on a
    # PR → dev, whatever branches the trigger above lists.
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The applied-path check (#393) builds a database from the supabase/ tree at the
          # commit named in supabase/applied-path-baseline. A shallow clone does not have it.
          fetch-depth: 0

      - name: Install Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.104.0

      - name: Start local Supabase stack (applies migrations + seed)
        # Full `supabase start` (not `db start`): e2e needs auth/API/mailpit, and
        # `supabase status -o env` only emits keys when the full stack is up.
        # KEPT (load-bearing): db (pgTAP) · auth/rest/kong (app API) · inbucket (e2e
        # magic-link/reset). EXCLUDED: containers MOS's first slice never uses — speeds
        # the boot (~the dominant CI cost). edge-runtime/functions (no edge fns; the
        # edge-runtime container also intermittently 502s — flaked PR #9); studio/meta
        # (admin UI); imgproxy/storage (no file features); realtime (no subscriptions);
        # vector/analytics (log shipping). Re-add a name here if the app starts using it.
        run: supabase start -x edge-runtime,functions,studio,meta,imgproxy,storage,realtime,vector,analytics

      # Logic lives in scripts/lint-security-definer.sh (#565) — this used to be inline here AND
      # in the `pgtap` job that has since moved to geometry.yml, an acknowledged sync burden. One
      # file, called from both dev-PR (geometry.yml) and main-PR (here) lanes.
      - name: Lint — every SECURITY DEFINER migration must revoke PUBLIC execute
        run: bash scripts/lint-security-definer.sh

      - name: pgTAP suite
        run: supabase test db

      # #393. THE GATE IMMEDIATELY BEFORE A STAGING DEPLOY, which is the entire point of the
      # check: staging and production are the only environments that run a conditional
      # migration's other branch. `--prove` also breaks the conditional on purpose and requires
      # the applied path to go red while a fresh reset stays byte-identical — so the run itself
      # is the evidence that this check can fail, not a claim in a PR body.
      - name: Applied-path check + proof it can fail (#393)
        run: bash scripts/applied-path-check.sh --prove --out artifacts/applied-path

      - name: Publish the green/red contrast to the run summary
        if: always()
        run: cat artifacts/applied-path/SUMMARY.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Keep the fingerprints and diffs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: applied-path-${{ github.run_id }}
          path: artifacts/applied-path
          retention-days: 14

      # ── E2E against the live stack ────────────────────────────────────────────
      # e2e lives here (not verify.yml) because journeys need auth + DB (T-027).
      # Inject local anon/service_role keys from `supabase status -o env` so they
      # are never hard-coded; the local keys are well-known dev constants anyway.

      - name: Export Supabase env to GITHUB_ENV
        # No `|| true`: if the keys are missing we want THIS step to fail, not e2e.
        run: |
          # status emits KEY="value" — strip the quotes or GITHUB_ENV keeps them literally
          supabase status -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY|API_URL)=' | tr -d '"' >> "$GITHUB_ENV"
          grep -q '^SERVICE_ROLE_KEY=eyJ' "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mos-app/package-lock.json

      - name: Install app dependencies
        working-directory: mos-app
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('mos-app/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: mos-app
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: mos-app
        run: npx playwright install-deps chromium

      - name: E2E tests (live stack)
        working-directory: mos-app
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:44321
          VITE_SUPABASE_ANON_KEY: ${{ env.ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          VITE_SHOW_PLAN_BUDGET: 'true'
        run: npx playwright test

      - name: Stop stack
        if: always()
        run: supabase stop
