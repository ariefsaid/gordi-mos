<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOS needs a connection</title>
    <!--
      The navigation fallback the service worker serves when a HARD RELOAD happens with no
      connection: the app bundle cannot be fetched, so there is no React, no catalog and no shell
      to render an in-frame error state. This document is therefore standalone by necessity —
      no script imports, no stylesheet links, no fonts. It carries the brand block, one sentence,
      and the one control that helps.

      Copy lives here in both locales rather than in the catalog, because the catalog ships inside
      the bundle this page exists to stand in for. The persisted locale key is the same one
      I18nProvider writes (`mos.locale`).
    -->
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100dvh;
        display: flex; align-items: center; justify-content: center;
        padding: 16px; background: #f7f7f8; color: #16181f;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card { width: min(100%, 400px); text-align: center; }
      .brand { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 20px; }
      .mark { position: relative; width: 26px; height: 26px; }
      .mark-square {
        width: 100%; height: 100%; border-radius: 4px; background: #1e2a4a; color: #fff;
        font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center;
      }
      .mark-dot {
        position: absolute; right: 0; bottom: 0; width: 5px; height: 5px; border-radius: 50%;
        background: #e67333; transform: translate(30%, 30%);
      }
      .wordmark { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
      h1 { margin: 0 0 8px; font-size: 20px; font-weight: 600; line-height: 1.3; }
      p { margin: 0 0 20px; font-size: 14px; line-height: 1.45; color: #5b6070; }
      button {
        min-height: 44px; padding: 0 20px; border-radius: 8px; border: 1px solid #1e2a4a;
        background: #1e2a4a; color: #fff; font: inherit; font-size: 14px; cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #14161c; color: #eceef4; }
        p { color: #9aa0b0; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <span class="mark">
          <span class="mark-square">G</span>
          <span class="mark-dot"></span>
        </span>
        <span class="wordmark">Gordi MOS</span>
      </div>
      <h1 id="title">MOS needs a connection</h1>
      <p id="copy">Check your connection and try again.</p>
      <button type="button" id="retry" onclick="location.reload()">Try again</button>
    </div>
    <script>
      // Indonesian is the other shipped locale; anything else keeps the English already in the DOM.
      try {
        if (localStorage.getItem('mos.locale') === 'id') {
          document.documentElement.lang = 'id'
          document.getElementById('title').textContent = 'MOS membutuhkan koneksi'
          document.getElementById('copy').textContent = 'Periksa koneksi Anda lalu coba lagi.'
          document.getElementById('retry').textContent = 'Coba lagi'
        }
      } catch (e) { /* storage blocked — English stands */ }
    </script>
  </body>
</html>
